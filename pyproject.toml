[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "session-labeling-skills"
version = "0.5.0"
description = "Auditable session understanding, labeling, selection, and export pipeline"
requires-python = ">=3.10"
dependencies = ["PyYAML>=5.4", "jsonschema>=4", "openai>=2"]

[project.scripts]
session-labeling = "session_labeling.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
